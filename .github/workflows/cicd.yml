name: CICD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_OWNER: ticketrushplatform
  IMAGE_NAME: migrations_service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image tag
        id: meta
        run: |
          IMAGE=ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          echo "Using image: $IMAGE"

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }} \
            .

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
  
    steps:
      - name: Run migration job on k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
  
          script: |
            IMAGE=${{ needs.build-and-push.outputs.image }}
  
            echo "Running migrations with $IMAGE"
  
            sudo kubectl delete job migrations \
              -n ticketrush \
              --ignore-not-found
  
            sudo kubectl create job migrations \
              --image=$IMAGE \
              -n ticketrush
  
            sudo kubectl wait --for=condition=complete job/migrations \
            -n ticketrush \
            --timeout=180s
